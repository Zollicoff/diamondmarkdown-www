<!doctype html>
<!-- The card shown when the site's address is shared. Rendered at exactly
     1200 by 630 into og-image.png; see the README. -->
<html lang="en">
<meta charset="utf-8">
<title>Diamond Markdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
	* { box-sizing: border-box; }
	html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
	body {
		position: relative;
		color: #e7ecff;
		background:
			radial-gradient(ellipse 520px 420px at 1010px 300px, rgba(129, 140, 248, 0.20), transparent 70%),
			radial-gradient(ellipse 620px 460px at 120px 60px, rgba(125, 211, 252, 0.13), transparent 70%),
			#0a0e1a;
		font-family: 'Bricolage Grotesque', sans-serif;
	}
	.rules { position: absolute; inset: 0; }
	h1 {
		position: absolute;
		left: 72px; top: 126px;
		margin: 0;
		font-weight: 800;
		font-size: 100px;
		line-height: 0.92;
		letter-spacing: -0.04em;
	}
	.tag {
		position: absolute;
		left: 75px; top: 346px;
		margin: 0;
		color: #b7c6e1;
		font-weight: 500;
		font-size: 33px;
		letter-spacing: -0.015em;
	}
	.mark {
		position: absolute;
		left: 892px; top: 181px;
		width: 240px; height: 240px;
	}
	footer {
		position: absolute;
		left: 72px; right: 72px; bottom: 43px;
		display: flex;
		justify-content: space-between;
		align-items: center;
		padding-top: 24px;
		border-top: 1px solid #34405c;
		color: #98a2c7;
		font: 500 18px 'JetBrains Mono', monospace;
	}
	footer b { font-weight: 500; color: #7dd3fc; }
</style>
<body>
<svg class="rules" aria-hidden="true" width="1200" height="630" viewBox="0 0 1200 630" fill="none" stroke="#2b3653"><path d="M735 170h465M735 302h465M735 434h465M802 110v382"/></svg>
<img class="mark" src="../favicon.svg" alt="">
<h1>Diamond<br>Markdown</h1>
<p class="tag">A knowledge base of your own.</p>
<footer><b>diamondmarkdown.com</b><span>Native · macOS and Linux · Open source</span></footer>
</body>
</html>
