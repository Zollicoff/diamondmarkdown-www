<!doctype html>
<!-- The icon phones use for a bookmark on the home screen: the mark on the
     site's background, since those icons cannot be transparent. Rendered at
     180 by 180. -->
<meta charset="utf-8">
<style>
	html, body { margin: 0; width: 100vw; height: 100vh; }
	body {
		display: grid;
		place-items: center;
		background:
			radial-gradient(circle at 50% 50%, rgba(125, 211, 252, 0.16), transparent 62%),
			#0a0e1a;
	}
	img { width: 70%; height: 70%; }
</style>
<img src="../favicon.svg" alt="">
